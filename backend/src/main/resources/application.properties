server.port=8080

# Spring Application Name
spring.application.name=online-learning-platform

# Database Configuration (MySQL / H2 fallback for standalone execution)
spring.datasource.url=jdbc:mysql://localhost:3306/learnhub_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# H2 Fallback Console (if running without MySQL)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Secret Configuration
jwt.secret=learnhub_jwt_super_secret_key_2026_antigravity_master_key_9988776655
jwt.expiration=604800000

# Swagger OpenAPI UI Path
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
